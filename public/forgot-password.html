<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forgot Password — Rent Bauchi</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23080B10'/%3E%3Cpath d='M5 11 12 5l7 6' stroke='%23DF7F33' stroke-width='2' fill='none'/%3E%3Cpath d='M7.5 10v9h9v-9' stroke='%23F5F5F2' stroke-width='2' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="form-page">
      <div class="form-card reveal-scale">
        <a class="brand" href="index.html">
          <span class="brand-mark">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
          </span>
          Rent Bauchi
        </a>
        <h1 id="title">Reset Password</h1>
        <p class="muted" id="sub">
          Enter your account email and we'll email you a 6-digit reset code.
        </p>
        <form id="forgotForm">
          <label for="email">Email</label>
          <div class="input-wrap" style="margin-top: 6px">
            <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="m3 7 9 6 9-6"/></svg>
            <input type="email" id="email" name="email" required placeholder="you@example.com" />
          </div>
          <button class="btn btn-primary btn-block" id="step1Btn" style="margin-top: 14px">
            Get Reset Token
          </button>
        </form>
        <form id="resetForm" class="hide">
          <label for="token">Reset Token</label>
          <div class="input-wrap" style="margin-top: 6px">
            <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="9" r="6"/><path d="m2 21 8-8"/><path d="m18 12 3 3"/></svg>
            <input type="text" id="token" name="token" required placeholder="6-digit code" />
          </div>
          <label style="display: block; margin-top: 14px">New Password</label>
          <div class="input-wrap" style="margin-top: 6px">
            <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input
              type="password"
              id="newPassword"
              name="newPassword"
              minlength="6"
              required
              placeholder="••••••••"
            />
          </div>
          <button class="btn btn-primary btn-block" id="step2Btn" style="margin-top: 14px">
            Set New Password
          </button>
        </form>
<div id="tokenOut" class="notice hide" style="margin-top: 14px">
        Demo mode: keep this code — you'll paste it in the next step.
      </div>
        <p class="muted" style="margin-top: 16px">
          Remembered it? <a href="login.html" style="color: var(--secondary-light); font-weight: 700">Back to Login</a>
        </p>
      </div>
      <div class="form-page-foot">
        © <span data-year>2026</span> Rent Bauchi · <a href="index.html">Back to home</a>
      </div>
    </main>
    <script src="js/app.js"></script>
    <script>
      document.querySelector("#forgotForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = $("#step1Btn");
        setLoading(btn, true, "Generating…");
        try {
          const d = await api("/auth/forgot", {
            method: "POST",
            body: JSON.stringify({ email: $("#email").value }),
          });
          setLoading(btn, false);
          window.__resetEmail = $("#email").value;
          window.__resetToken = d.resetToken;
          $("#tokenOut").textContent =
            "Demo mode: your reset code is " + d.resetToken + ". Paste it in the next step.";
          $("#tokenOut").classList.remove("hide");
          $("#forgotForm").classList.add("hide");
          $("#resetForm").classList.remove("hide");
          document.querySelector("#sub").textContent =
            "Enter the 6-digit code we sent you and set your new password.";
          toast("Reset code generated.");
        } catch (x) {
          setLoading(btn, false);
          toast(x.message, "error");
        }
      });
      document.querySelector("#resetForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = $("#step2Btn");
        setLoading(btn, true, "Resetting…");
        try {
          await api("/auth/reset", {
            method: "POST",
            body: JSON.stringify({
              email: window.__resetEmail || $("#email").value,
              token: $("#token").value || window.__resetToken,
              newPassword: $("#newPassword").value,
            }),
          });
          setLoading(btn, false);
          toast("Password reset. Please log in.");
          setTimeout(() => (location.href = "login.html"), 1200);
        } catch (x) {
          setLoading(btn, false);
          toast(x.message, "error");
        }
      });
      reveal();
    </script>
  </body>
</html>
