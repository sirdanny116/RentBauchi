<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login — Rent Bauchi</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230E314D'/%3E%3Cpath d='M5 11 12 5l7 6' stroke='white' stroke-width='2' fill='none'/%3E%3Cpath d='M7.5 10v9h9v-9' stroke='white' stroke-width='2' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="form-page">
      <form class="form-card reveal-scale" id="loginForm">
        <a class="brand" href="index.html">
          <span class="brand-mark">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
          </span>
          Rent Bauchi
        </a>
        <h1>Welcome back</h1>
        <p class="muted">
          Your account role decides which dashboard you enter.
        </p>
        <div id="error" class="error"></div>
        <div class="field">
          <label>Email / Username</label>
          <div class="input-wrap">
            <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <input name="identifier" required placeholder="you@example.com" />
          </div>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="input-wrap">
            <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input name="password" type="password" required placeholder="••••••••" />
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="loginBtn">
          <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
          Login
        </button>
        <p class="form-links">
          <a href="forgot-password.html">Forgot Password?</a>
        </p>
        <p class="muted" style="font-size: 13.5px">
          Don't have an account?
          <a href="register.html" style="color: var(--primary); font-weight: 700">Create an account</a>
        </p>
      </form>
      <div class="form-page-foot">
        © <span data-year>2026</span> Rent Bauchi · <a href="index.html">Back to home</a>
      </div>
    </main>
    <script src="js/app.js"></script>
    <script>
      document
        .querySelector("#loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const f = new FormData(e.target);
          const er = $("#error");
          er.style.display = "none";
          const btn = $("#loginBtn");
          setLoading(btn, true, "Logging in…");
          try {
            const d = await api("/auth/login", {
              method: "POST",
              body: JSON.stringify(Object.fromEntries(f)),
            });
            setSession(d);
            toast("Welcome back, " + (d.user.fullName || "").split(" ")[0] + "!");
            setTimeout(() => {
              location.href =
                d.user.role === "renter"
                  ? "/renter-dashboard.html"
                  : d.user.role === "agent"
                    ? "/agent-dashboard.html"
                    : "/admin/";
            }, 500);
          } catch (x) {
            setLoading(btn, false);
            toast(x.message, "error");
            er.textContent = x.message;
            er.style.display = "block";
          }
        });
      reveal();
    </script>
  </body>
</html>
