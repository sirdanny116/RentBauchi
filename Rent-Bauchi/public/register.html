<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create Account — Rent Bauchi</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230E314D'/%3E%3Cpath d='M5 11 12 5l7 6' stroke='white' stroke-width='2' fill='none'/%3E%3Cpath d='M7.5 10v9h9v-9' stroke='white' stroke-width='2' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="form-page">
      <form class="form-card reveal-scale" id="regForm">
        <a class="brand" href="index.html">
          <span class="brand-mark">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
          </span>
          Rent Bauchi
        </a>
        <h1>Create account</h1>
        <p class="muted">Get started in under a minute — it's free.</p>
        <div id="error" class="error"></div>
        <div class="field">
          <label>Full Name</label>
          <div class="input-wrap">
            <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <input name="fullName" required placeholder="Aisha Bello" />
          </div>
        </div>
        <div class="field">
          <label>I am a</label>
          <div class="choice-row">
            <label class="choice"
              ><input type="radio" name="role" value="renter" checked />
              Renter</label
            ><label class="choice"
              ><input type="radio" name="role" value="agent" /> Owner</label
            >
          </div>
        </div>
        <div class="field">
          <label>Username</label>
          <div class="input-wrap">
            <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
            <input name="username" required placeholder="aisha_b" />
          </div>
        </div>
        <div class="field">
          <label>Phone Number</label>
          <div class="input-wrap">
            <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a12 12 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>
            <input name="phone" required placeholder="+234 800 000 0000" />
          </div>
        </div>
        <div class="field">
          <label>Email</label>
          <div class="input-wrap">
            <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="m3 7 9 6 9-6"/></svg>
            <input name="email" type="email" required placeholder="you@example.com" />
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Password</label>
            <div class="input-wrap">
              <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input name="password" type="password" required placeholder="••••••••" />
            </div>
          </div>
          <div class="field">
            <label>Confirm Password</label>
            <div class="input-wrap">
              <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input name="confirmPassword" type="password" required placeholder="••••••••" />
            </div>
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="regBtn">Create Account</button>
        <p class="muted" style="font-size: 13.5px; margin-top: 14px">
          Already have an account?
          <a href="login.html" style="color: var(--primary); font-weight: 700">Login</a>
        </p>
      </form>
      <div class="form-page-foot">
        © <span data-year>2026</span> Rent Bauchi · <a href="index.html">Back to home</a>
      </div>
    </main>
    <script src="js/app.js"></script>
    <script>
      document
        .querySelector("#regForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const er = $("#error");
          er.style.display = "none";
          const btn = $("#regBtn");
          setLoading(btn, true, "Creating account…");
          try {
            const d = await api("/auth/register", {
              method: "POST",
              body: JSON.stringify(Object.fromEntries(new FormData(e.target))),
            });
            setSession(d);
            toast("Account created. Welcome to Rent Bauchi!");
            setTimeout(() => {
              location.href =
                d.user.role === "agent"
                  ? "/agent-dashboard.html"
                  : "/renter-dashboard.html";
            }, 500);
          } catch (x) {
            setLoading(btn, false);
            toast(x.message, "error");
            er.textContent = x.message;
            er.style.display = "block";
          }
        });
      reveal();
    </script>
  </body>
</html>
