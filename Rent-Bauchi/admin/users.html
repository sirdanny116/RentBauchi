<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Users & Verification — Rent Bauchi Admin</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="dashboard-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="/admin/dashboard.html">
          <span class="brand-mark">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
          </span>
          Rent Bauchi Admin
        </a>
        <nav class="side-nav">
          <a href="dashboard.html">
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>
            Overview
          </a>
          <a class="active" href="users.html">
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16.5 4.5a3.5 3.5 0 0 1 0 6.6"/><path d="M18.5 20a6.5 6.5 0 0 0-3.2-5.6"/></svg>
            Users & Verification
          </a>
          <a href="properties.html">
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/><path d="M16 9h3a1 1 0 0 1 1 1v11"/><path d="M8 8h2M8 12h2M8 16h2M2 21h20"/></svg>
            Property Review
          </a>
          <a href="requests.html">
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
            Requests
          </a>
          <div class="sidebar-divider"></div>
          <button data-logout>
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            Logout
          </button>
        </nav>
      </aside>
      <main class="main">
        <button
          class="btn btn-light mobile-menu"
          onclick="sidebar.classList.toggle('open')"
        >
          <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          Menu
        </button>
        <div class="dash-top">
          <div>
            <h1>Users & Owner Verification</h1>
            <p class="muted">
              NIN documents are displayed only inside this Admin portal.
            </p>
          </div>
        </div>
        <section class="panel">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>User</th>
                  <th>Role</th>
                  <th>Verification</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
        <div id="verifyPanel" class="panel hide"></div>
      </main>
    </div>
    <script src="js/app.js"></script>
    <script>
      if (!protect()) throw new Error("stop");
      async function load() {
        const d = await api("/admin/users");
        $("#rows").innerHTML = d.users
          .map(
            (u) =>
              `<tr><td><strong>${esc(u.fullName)}</strong><br>${esc(u.email)}<br>${esc(u.phone || "")}</td><td>${esc(u.role)}</td><td>${u.role === "agent" ? (u.verified ? "<span class='status APPROVED'>Verified</span>" : "<span class='status PENDING'>Pending</span>") : "—"}</td><td>${u.role === "agent" ? `<button class="btn btn-light" onclick="review('${u.id}')">Review NIN</button> <button class="btn ${u.verified ? "btn-danger" : "btn-primary"}" onclick="verifyUser('${u.id}',${!u.verified})">${u.verified ? "Reject" : "Approve"}</button>` : ""}</td></tr>`,
          )
          .join("");
      }
      load();
      async function review(id) {
        const d = await api("/admin/verification/" + id);
        const a = d.agent;
        $("#verifyPanel").classList.remove("hide");
        $("#verifyPanel").innerHTML =
          `<div class="profile-head"><img class="avatar" src="${photo(a.profileImage)}"><div><h2>${esc(a.fullName)}</h2><p>${esc(a.email)} · ${esc(a.location || "")}</p></div></div><h3>NIN Document</h3>${a.ninImage ? `<img style="max-width:100%;max-height:500px;border-radius:12px" src="${photo(a.ninImage)}">` : "<div class='empty'>No NIN uploaded yet.</div>"}`;
        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: "smooth",
        });
      }
      async function verifyUser(id, v) {
        try {
          await api("/admin/users/" + id + "/verify", {
            method: "PUT",
            body: JSON.stringify({ verified: v }),
          });
          toast(v ? "Owner verified." : "Owner verification removed.");
          load();
        } catch (x) {
          toast(x.message, "error");
        }
      }
    </script>
  </body>
</html>
